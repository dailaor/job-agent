[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "local-job-agent"
version = "0.1.0"
description = "A local-first, fixed-channel job search and application agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pypdf>=5,<7", "cryptography>=43,<47"]

[project.optional-dependencies]
browser = ["playwright>=1.50"]
release = ["pyinstaller>=6.10,<7"]

[project.scripts]
job-agent = "job_agent.cli:main"
job-agent-desktop = "job_agent.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/job_agent/static" = "job_agent/static"
